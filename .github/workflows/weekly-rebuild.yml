# Rebuilds the site once a week so the "Most popular" listings refresh.
#
# View counts are snapshotted at build time (scripts/generateViews.js) rather
# than read per request, which keeps Firestore reads flat no matter how much
# traffic the site gets. The trade-off is that the ranking only moves when a
# build runs, so in a week without publishing it would otherwise freeze.
#
# Needs a Vercel Deploy Hook URL stored as the VERCEL_DEPLOY_HOOK_URL secret:
# Vercel project -> Settings -> Git -> Deploy Hooks -> create one for main.
name: Weekly rebuild

on:
  schedule:
    # Mondays 04:00 UTC - quiet hours, and a fresh ranking to start the week.
    - cron: "0 4 * * 1"
  # Lets the ranking be refreshed on demand without waiting for Monday.
  workflow_dispatch:

concurrency:
  group: weekly-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger a production deploy
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL is not set - nothing to trigger." >&2
            exit 1
          fi
          curl --fail --silent --show-error --request POST \
            "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
          echo "Deploy hook fired."
