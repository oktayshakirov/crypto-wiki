# Builds the static export and deploys it to Cloudflare Workers.
#
# Runs on every push to main (a push is a production deploy), daily so the
# Fear & Greed score baked into /tools/fear-and-greed-index stays current and
# the "Most popular" listings refresh even without new content (view counts are
# snapshotted at build time by scripts/generateViews.js, which keeps Firestore
# reads flat no matter how much traffic the site gets), and on demand.
#
# Push notifications are a separate workflow (notify-new-content.yml). It waits
# for this deploy by polling the live content-index.json, so it needs no link
# to this one.
#
# Secrets: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit), CLOUDFLARE_ACCOUNT_ID,
# and the FIREBASE_* trio the notify workflow already uses (generateViews reads
# Firestore during the build).
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # Daily 04:00 UTC - quiet hours, and after alternative.me publishes the
    # day's Fear & Greed reading (00:00 UTC).
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  # Never two deploys at once; a newer push waits rather than cancelling one
  # that is halfway through uploading.
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      # Build-time WebP variants, keyed by source content hash. A warm cache
      # turns a ~3,800-image render into a copy.
      - uses: actions/cache@v4
        with:
          path: .image-cache
          key: image-cache-${{ hashFiles('public/**/*.jpg', 'public/**/*.jpeg', 'public/**/*.png', 'public/**/*.webp') }}
          restore-keys: image-cache-

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
